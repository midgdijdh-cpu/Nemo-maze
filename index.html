<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b1b"><link rel="manifest" href="manifest.webmanifest">
<title>Nemo Maze</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b1b;color:#eaf5ff;font-family:system-ui,Tahoma,sans-serif;overflow:hidden;touch-action:none}
#app{height:100dvh;height:100svh;min-height:100%;width:100%;display:flex;flex-direction:column;max-width:none;margin:0;padding:8px;gap:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0}
.logo{font-weight:900;letter-spacing:1px;color:#55d9ff;text-shadow:0 0 15px #087da9;font-size:clamp(15px,4vw,22px)}
.stats{display:flex;gap:5px;font-size:clamp(11px,3vw,14px)}.pill{background:#111b35;border:1px solid #24476c;border-radius:10px;padding:6px 8px}
#screen{position:relative;flex:1;min-height:0;width:100%;border:1px solid #24547a;border-radius:14px;overflow:hidden;background:#02040c;box-shadow:0 0 25px #007ca822}
canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;background:#050a19eF;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:13px}
#overlay h1{font-size:34px;margin:0;color:#63dfff;text-shadow:0 0 22px #00bfff}
#overlay p{color:#b6c9e2;line-height:1.8;margin:0}
button{border:1px solid #287eaa;background:linear-gradient(135deg,#12365a,#10213e);color:#effaff;border-radius:13px;padding:12px 18px;font-weight:800;font-size:15px}
button:active{transform:scale(.96);filter:brightness(1.3)}
.primary{background:linear-gradient(135deg,#087cae,#1645a0);min-width:170px}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:min(100%,440px);margin:0 auto;flex-shrink:0}
.controls button{height:clamp(48px,8svh,68px);font-size:clamp(22px,6vw,30px);padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.controls .empty{visibility:hidden}
.bottom{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;flex-shrink:0}.bottom button{font-size:clamp(11px,3vw,14px);padding:9px 12px}.turn-controls{display:flex;justify-content:center;gap:12px;flex-shrink:0}.turn-controls button{min-width:105px;height:42px;font-size:15px;touch-action:none}
small{color:#91a9c5;text-align:center}
#fullscreen{min-width:40px;padding:6px 10px;font-size:18px}@media(max-height:650px){#app{gap:5px;padding:5px}.controls button{height:42px}.turn-controls button{height:34px}.bottom button{padding:6px 9px}header .pill{padding:4px 6px}}
</style></head>
<body><div id="app">
<header><div class="logo">NEMO MAZE</div><div class="stats"><div class="pill">❤️ <b id="lives">3</b></div><div class="pill">مرحله <b id="level">1</b></div><div class="pill">🔑 <b id="keyStatus">نداری</b></div><div class="pill">⏱ <b id="time">00:00</b></div><button id="fullscreen" aria-label="تمام صفحه">⛶</button></div></header>
<div id="screen"><canvas id="view" width="640" height="420"></canvas><div id="overlay"><h1>NEMO MAZE</h1><p>به هزارتوی سه‌بعدی خوش آمدی.<br>کلید طلایی را پیدا کن، از تله‌ها دوری کن و به در خروج برس!</p><button class="primary" id="start">شروع بازی</button><small>نسخه Level Update · ۵۰ مرحله · ذخیره خودکار</small></div></div>
<div class="controls" aria-label="حرکت در چهار جهت">
<button class="empty">·</button><button data-move="north">▲</button><button class="empty">·</button>
<button data-move="west">◀</button><button data-move="south">▼</button><button data-move="east">▶</button>
</div>
<div class="turn-controls"><button data-turn="left">↶ چرخش چپ</button><button data-turn="right">چرخش راست ↷</button></div>
<div class="bottom"><button id="map">نمایش نقشه</button><button id="restart">شروع دوباره</button><button id="sound">🔊 صدا: روشن</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let N=17,maze=[],px=1,py=1,dir=0,lives=3,level=Number(localStorage.getItem("nemoLevel")||1),steps=0,seconds=0,started=false,ended=false,showMap=false,sound=true,tick=null,hasKey=false; const MAX_LEVEL=50;
const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
function build(){
 N=17+2*Math.min(7,Math.floor((level-1)/7));
 maze=Array.from({length:N},()=>Array(N).fill(1));
 let stack=[[1,1]];maze[1][1]=0;
 while(stack.length){
  let [x,y]=stack[stack.length-1];
  let opts=[[0,-2],[2,0],[0,2],[-2,0]].filter(([dx,dy])=>x+dx>0&&x+dx<N-1&&y+dy>0&&y+dy<N-1&&maze[y+dy][x+dx]===1);
  if(!opts.length){stack.pop();continue}
  let [dx,dy]=opts[Math.floor(Math.random()*opts.length)];
  maze[y+dy/2][x+dx/2]=0;maze[y+dy][x+dx]=0;stack.push([x+dx,y+dy]);
 }
 // Add loops gradually for later levels
 for(let i=0;i<level*2;i++){let x=1+Math.floor(Math.random()*(N-2)),y=1+Math.floor(Math.random()*(N-2));if(maze[y][x]===1)maze[y][x]=0}
 maze[1][1]=0;maze[N-2][N-2]=2;
 const free=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(maze[y][x]===0&&(x!==1||y!==1))free.push([x,y]);
 const kp=free.splice(Math.floor(Math.random()*free.length),1)[0];maze[kp[1]][kp[0]]=4;
 const trapCount=Math.min(2+Math.floor(level/4),12);
 for(let i=0;i<trapCount&&free.length;i++){const q=free.splice(Math.floor(Math.random()*free.length),1)[0];maze[q[1]][q[0]]=3}
 px=1;py=1;dir=0;lives=3;steps=0;hasKey=false;ended=false;started=true;$('keyStatus').textContent='نداری';
 $('lives').textContent=lives;$('level').textContent=level;
 $('overlay').style.display='none';draw();
}
function wall(x,y){return x<0||y<0||x>=N||y>=N||maze[y][x]===1}
function move(direction){
 if(!started||ended)return;
 let delta={north:[0,-1],south:[0,1],west:[-1,0],east:[1,0]}[direction];
 if(!delta)return;
 let nx=px+delta[0],ny=py+delta[1];
 if(wall(nx,ny)){lives--; $('lives').textContent=lives;beep(110,.09);if(lives<=0)finish(false);draw();return}
 px=nx;py=ny;steps++;beep(320,.035);
 if(maze[py][px]===4){hasKey=true;maze[py][px]=0;$('keyStatus').textContent='داری';beep(700,.12)}
 if(maze[py][px]===3){lives--; $('lives').textContent=lives;beep(130,.16);maze[py][px]=0;if(lives<=0){finish(false);return}}
 if(maze[py][px]===2){if(!hasKey){px-=delta[0];py-=delta[1];beep(150,.12);draw();return}finish(true);return}
 draw();
}
function turnCamera(direction){
 if(!started||ended)return;
 dir=direction==='left'?(dir+3)%4:(dir+1)%4;
 draw();
}
function beep(freq,duration){if(!sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration);o.onended=()=>a.close()}catch(e){}}
function finish(win){
 ended=true;clearInterval(tick);
 $('overlay').style.display='flex';
 $('overlay').innerHTML=win?`<h1>مرحله ${level} کامل شد!</h1><p>عالی بود!<br>تعداد حرکت: ${steps} · زمان: ${fmt(seconds)}</p><button class="primary" id="next">مرحله بعد</button>`:`<h1>پایان بازی</h1><p>هر سه قلبت تمام شد.<br>دوباره تلاش کن!</p><button class="primary" id="again">تلاش دوباره</button>`;
 $('next')?.addEventListener('click',()=>{level++;seconds=0;startTimer();build()});
 $('again')?.addEventListener('click',()=>{seconds=0;startTimer();build()});
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(started&&!ended){seconds++;$('time').textContent=fmt(seconds)}},1000)}
function draw(){
 const w=canvas.width,h=canvas.height;ctx.fillStyle='#030712';ctx.fillRect(0,0,w,h);
 // ray-cast pseudo-3D corridor
 const fov=Math.PI/2.8;
 for(let col=0;col<w;col++){
  let angle=dir*Math.PI/2-Math.PI/2+(col/w)*fov;
  let dist=0,hit=false;
  while(dist<18&&!hit){dist+=.035;let rx=px+Math.cos(angle)*dist,ry=py+Math.sin(angle)*dist;if(wall(Math.floor(rx),Math.floor(ry)))hit=true}
  let corrected=dist*Math.cos(angle-(dir*Math.PI/2));
  let height=Math.min(h,(h/(corrected+.08))*0.82);
  let shade=Math.max(18,145-corrected*12);
  let side=Math.floor((col/w)*N)%2;
  ctx.fillStyle=`rgb(${Math.floor(shade*.25)},${Math.floor(shade*.65)},${Math.floor(shade*.95)})`;
  ctx.fillRect(col,(h-height)/2,1,height);
  ctx.fillStyle=`rgba(0,210,255,${Math.max(0,.13-corrected*.006)})`;ctx.fillRect(col,(h-height)/2,1,height);
 }
 // floor/ceiling
 let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#071326');grad.addColorStop(.5,'#101c30');grad.addColorStop(1,'#030711');
 ctx.fillStyle=grad;ctx.globalCompositeOperation='destination-over';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='source-over';
 if(showMap){
  let s=8,ox=10,oy=10;ctx.fillStyle='#000b';ctx.fillRect(ox-4,oy-4,N*s+8,N*s+8);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=maze[y][x]===1?'#4c7897':maze[y][x]===2?'#ff3e79':maze[y][x]===3?'#ff9f43':maze[y][x]===4?'#ffd84a':'#101b2c';ctx.fillRect(ox+x*s,oy+y*s,s-1,s-1)}
  ctx.fillStyle='#36e5ff';ctx.fillRect(ox+px*s+1,oy+py*s+1,s-3,s-3);
 }
}
$('start').addEventListener('click',()=>{seconds=0;startTimer();build()});
$('restart').addEventListener('click',()=>{seconds=0;startTimer();build()});
$('map').addEventListener('click',()=>{showMap=!showMap;draw()});
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 صدا: روشن':'🔇 صدا: خاموش'});
// Pointer events make touch controls respond immediately and consistently on Android.
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.move)}));
document.querySelectorAll('[data-turn]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turnCamera(b.dataset.turn)}));
document.addEventListener('keydown',e=>{
 const m={ArrowUp:'north',ArrowDown:'south',ArrowLeft:'west',ArrowRight:'east'}[e.key];
 if(m){e.preventDefault();move(m)}
 if(e.key==='q'||e.key==='Q')turnCamera('left');
 if(e.key==='e'||e.key==='E')turnCamera('right');
});
$('fullscreen').addEventListener('click',async()=>{
 try{
  if(!document.fullscreenElement){await document.documentElement.requestFullscreen();$('fullscreen').textContent='⛶'}
  else await document.exitFullscreen();
 }catch(e){$('fullscreen').textContent='⛶'}
});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'✕':'⛶'});
draw();
})();
</script></body></html>
